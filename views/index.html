<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>ShopSphere</title>

  <link rel="stylesheet" href="/css/style.css" />
  <link
  rel="preconnect"
  href="https://fonts.googleapis.com"
/>

<link
  rel="preconnect"
  href="https://fonts.gstatic.com"
  crossorigin
/>

<link
  href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
  rel="stylesheet"
/>
</head>

<body>

  <header class="navbar">

  <div class="nav-left">

    <h1 class="logo">
      ShopSphere
    </h1>

  </div>

  <nav id="navbarLinks">

    <a href="/">Home</a>

    <a href="/cart">
      🛒 Cart (
      <span id="cartCount">0</span>
      )
    </a>

    <a href="/login">
      Login
    </a>

    <a href="/register">
      Register
    </a>

  </nav>

</header>

<section class="hero">

  <div class="hero-content">

    <div class="hero-text">

      <span class="hero-badge">
        TRENDING COLLECTION
      </span>

      <h1>
        Discover Premium
        Shopping Experience
      </h1>

      <p>
        Explore top quality products
        with modern style and seamless
        shopping experience.
      </p>

      <button
  class="hero-btn"
  onclick="scrollToSearch()"
>
  Shop Now
</button>

      </a>

    </div>

    <div class="hero-image">

      <img
        src="/images/hero.png"
        alt="Hero"
      />

    </div>

  </div>

</section>

  <section class="products-section">

    <h2 class="section-title">
      Explore Products
    </h2>

    <div
  class="top-filters"
  id="searchSection"
>

  <div class="search-bar">

    <input
      type="text"
      id="searchInput"
      placeholder="Search products..."
    />

  </div>

  <div class="filter-container">

    <select id="categoryFilter">

      <option value="all">
       Select Category
      </option>

    </select>

  </div>

</div>
  </select>

</div>

</div>

    <div class="products-container" id="productsContainer">

    </div>

  </section>

  <div id="toast"></div>

  <script src="/js/toast.js"></script>
  <script src="/js/app.js"></script>

</body>
</html>
