<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Shopping Cart</title>

  <link rel="stylesheet" href="/css/style.css" />

</head>

<body>

  <header class="navbar">

    <h1 class="logo">
      ShopSphere
    </h1>

    <nav>
      <a href="/">Home</a>
    </nav>

  </header>

  <section class="cart-section">

    <h2 class="section-title">
      Your Shopping Cart
    </h2>

    <div id="cartContainer" class="cart-container">

    </div>

   <div class="cart-summary">

  <h2 id="cartTotal">
    Total: ₹0
  </h2>

  <button
    class="checkout-btn"
    id="checkoutBtn"
  >
    Proceed To Checkout
  </button>

</div>

  </section>

  <div id="toast"></div>

  <script src="/js/toast.js"></script>
  <script src="/js/cart.js"></script>

</body>
</html>
