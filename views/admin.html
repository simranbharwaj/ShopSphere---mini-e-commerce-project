<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Admin Dashboard</title>

  <link rel="stylesheet" href="/css/style.css" />

</head>

<body>

  <header class="navbar">

    <h1 class="logo">
      Admin Dashboard
    </h1>

    <nav>
      <a href="/">Home</a>
    </nav>

  </header>

  <section class="admin-section">

    <div id="formSection">

      <form
        id="productForm"
        class="admin-form"
      >

        <h2>Add Product</h2>

        <input
          type="text"
          id="name"
          placeholder="Product Name"
          required
        />

        <input
          type="number"
          id="price"
          placeholder="Price"
          required
        />

        <input
          type="text"
          id="image"
          placeholder="Image Name"
          required
        />

        <input
          type="text"
          id="category"
          placeholder="Category"
          required
        />

        <textarea
          id="description"
          placeholder="Description"
          rows="4"
          required
        ></textarea>

        <button type="submit">
          Add Product
        </button>

      </form>

    </div>

    <div
      id="adminProducts"
      class="products-container"
    >

    </div>

  </section>

  <div id="toast"></div>

  <script src="/js/toast.js"></script>
  <script src="/js/admin.js"></script>

</body>
</html>
