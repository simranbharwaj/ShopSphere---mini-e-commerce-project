<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Login</title>

  <link rel="stylesheet" href="/css/style.css" />

</head>

<body>

  <div class="auth-container">

    <form
      class="auth-form"
      id="loginForm"
    >

      <h2>Login</h2>

      <input
        type="email"
        placeholder="Email"
        id="email"
        required
      />

      <input
        type="password"
        placeholder="Password"
        id="password"
        required
      />

      <button type="submit">
        Login
      </button>

      <p>
        Don't have an account?
        <a href="/register">
          Register
        </a>
      </p>

    </form>

  </div>

  <div id="toast"></div>

  <script src="/js/toast.js"></script>
  <script src="/js/login.js"></script>

</body>
</html>
